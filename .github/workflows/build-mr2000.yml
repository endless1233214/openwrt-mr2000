name: Build MR2000 OpenWrt Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev quilt subversion time xsltproc

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch v25.12.4 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply MR2000 local port patch
        run: |
          cd openwrt
          git apply ../mr2000-port/patches/openwrt-v25.12.4-local/0001-local-qualcommax-ipq50xx-add-linksys-mr2000.patch
          git apply ../mr2000-port/patches/openwrt-v25.12.4-local/0002-local-ipq-wifi-copy-package-files.patch

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install MR2000 image overlay
        run: |
          mkdir -p openwrt/files
          rsync -a files/ openwrt/files/

      - name: Configure MR2000 initramfs build
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-adblock-fast=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_adblock-fast=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_tc-tiny=y
          EOF
          make defconfig

      - name: Build MR2000 images
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f \
            \( -name '*linksys_mr2000*' -o -name 'profiles.json' -o -name 'sha256sums' \) \
            -exec cp -v {} artifacts/ \; || true
          find artifacts -type f -maxdepth 1 -print -exec sha256sum {} \; | tee artifacts/ARTIFACTS.txt || true

      - name: Upload MR2000 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mr2000-openwrt-images
          path: artifacts/
          if-no-files-found: error
